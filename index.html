<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⛑️ 矿井安全监测 · 巴法云 & 信标定位</title>
    <script src="https://registry.npmmirror.com/echarts/5.5.0/files/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg: #1a1e26;
            --card: #242830;
            --accent: #f08a4b;
            --danger: #e74c3c;
            --safe: #2ecc71;
            --text: #e0e4ec;
            --text2: #a0aab4;
            --border: #3a4048;
            --radius: 20px;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: radial-gradient(circle at 50% 20%, #2c3340, #12161e);
            min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px;
        }
        .app {
            max-width: 800px; width: 100%; background: var(--bg); border-radius: 36px;
            padding: 16px 14px 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            border: 1px solid #3a4350; color: var(--text);
            display: flex; flex-direction: column; gap: 14px;
        }
        .nav { display: flex; gap: 8px; background: #1e2430; border-radius: 24px; padding: 4px; border: 1px solid #2e3844; }
        .nav-tab {
            flex: 1; text-align: center; padding: 10px 8px; border-radius: 20px;
            font-weight: 700; font-size: 14px; cursor: pointer; color: #9aa4b8; transition: 0.2s;
        }
        .nav-tab.active { background: var(--accent); color: #12161e; box-shadow: 0 4px 12px rgba(240,138,75,0.3); }
        .view { display: none; flex-direction: column; gap: 14px; }
        .view.active { display: flex; }
        .sensor-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 10px; }
        .sensor-card {
            background: var(--card); border-radius: var(--radius); padding: 12px 10px;
            text-align: center; border: 1px solid var(--border);
        }
        .sensor-value { font-size: 28px; font-weight: 800; color: #fff; }
        .sensor-label { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
        .sensor-unit { font-size: 12px; color: #7c8a9a; }
        .alarm-control {
            display: flex; align-items: center; justify-content: space-between;
            background: #2a303c; border-radius: 16px; padding: 8px 16px;
        }
        .btn {
            padding: 8px 18px; border-radius: 20px; font-weight: 600; font-size: 13px;
            cursor: pointer; border: none; background: #3d4854; color: #fff;
            transition: 0.2s; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary { background: var(--accent); color: #12161e; }
        .btn-danger { background: var(--danger); }
        .btn:active { transform: scale(0.96); }
        .chart-box { background: var(--card); border-radius: var(--radius); padding: 12px; border: 1px solid var(--border); }
        .chart-inner { width: 100%; height: 220px; }
        .ble-panel {
            background: var(--card); border-radius: var(--radius); padding: 14px;
            border: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
        }
        .ble-panel input {
            padding: 8px 12px; border-radius: 14px; border: 1px solid #3a444e;
            background: #131820; color: #fff; font-family: monospace; font-size: 12px; flex:1; min-width:160px;
        }
        .slider-group {
            display: flex; flex-direction: column; gap: 6px; width: 100%;
        }
        .slider-row {
            display: flex; align-items: center; gap: 8px;
        }
        .slider-row label { width: 40px; font-size: 12px; }
        input[type=range] { flex:1; accent-color: var(--accent); }
        .coordinate-view {
            display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: center;
        }
        canvas { background: #1e2630; border-radius: 16px; border: 1px solid #3a4652; }
        .position-info {
            background: #242830; border-radius: 16px; padding: 12px;
            font-family: monospace; font-size: 13px; color: #c0d0e0; border: 1px solid #3a4048;
        }
        .algo-steps {
            background: #1c222c; border-radius: 16px; padding: 14px;
            font-family: monospace; font-size: 12px; color: #b0c0d0; border: 1px solid #2e3844;
            line-height: 1.6; max-height: 200px; overflow-y: auto;
        }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-weight: 600; font-size: 11px; }
        .badge-on { background: #2c6b4e; color: #a0ffc0; }
        .badge-off { background: #5a3a3a; color: #ffa0a0; }
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 10px 24px; border-radius: 30px;
            font-size: 13px; z-index: 999; animation: fadeToast 2.5s forwards; pointer-events: none;
        }
        @keyframes fadeToast {
            0%{opacity:0;transform:translateX(-50%) translateY(10px);}
            15%{opacity:1;transform:translateX(-50%) translateY(0);}
            80%{opacity:1;} 100%{opacity:0;}
        }
    </style>
</head>
<body>
<div class="app">
    <div class="nav">
        <div class="nav-tab active" data-view="monitor">⛑️ 矿井监测</div>
        <div class="nav-tab" data-view="beacon">📡 信标定位</div>
    </div>

    <!-- 矿井监测视图 -->
    <div class="view active" id="view-monitor">
        <div class="sensor-row">
            <div class="sensor-card"><div class="sensor-label">💥 瓦斯</div><div class="sensor-value" id="gasVal">--</div><div class="sensor-unit">%</div></div>
            <div class="sensor-card"><div class="sensor-label">🫁 CO</div><div class="sensor-value" id="coVal">--</div><div class="sensor-unit">ppm</div></div>
            <div class="sensor-card"><div class="sensor-label">❤️ 心率</div><div class="sensor-value" id="hrVal">--</div><div class="sensor-unit">bpm</div></div>
            <div class="sensor-card"><div class="sensor-label">🌡️ 温度</div><div class="sensor-value" id="tempVal">--</div><div class="sensor-unit">°C</div></div>
            <div class="sensor-card"><div class="sensor-label">💧 湿度</div><div class="sensor-value" id="humiVal">--</div><div class="sensor-unit">%</div></div>
        </div>
        <div class="alarm-control">
            <span>🚨 远程报警状态：<span class="badge badge-off" id="alarmStatusBadge">关闭</span></span>
            <button class="btn btn-danger" onclick="toggleAlarm()">切换报警 (A)</button>
        </div>
        <div class="chart-box">
            <h3 style="margin-bottom:8px;">📈 环境参数趋势</h3>
            <div class="chart-inner" id="chartMulti"></div>
        </div>
        <div class="chart-box">
            <h3 style="margin-bottom:8px;">❤️ 心率趋势</h3>
            <div class="chart-inner" id="chartHR"></div>
        </div>
        <button class="btn" onclick="exportData()">📥 导出CSV</button>
    </div>

    <!-- 信标定位视图 -->
    <div class="view" id="view-beacon">
        <div class="ble-panel">
            <input id="svcUuid" value="0000fff0-0000-1000-8000-00805f9b34fb" placeholder="服务UUID">
            <button class="btn btn-primary" id="connectBtn">🔗 连接设备</button>
            <button class="btn" id="disconnectBtn" disabled>断开</button>
            <span id="connStatus" style="font-size:14px;">未连接</span>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
            <span style="font-size:14px;">模式：</span>
            <button class="btn" id="modeRealBtn" style="background:var(--accent);">📡 真实信号</button>
            <button class="btn" id="modeSimBtn">🧪 三点模拟</button>
        </div>

        <!-- 模拟滑块区域 (三点信标RSSI) -->
        <div class="slider-group" id="simSliders" style="display:none;">
            <div class="slider-row"><label>A信标</label><input type="range" id="rssiA" min="-90" max="-30" value="-55"><span id="valA">-55</span> dBm</div>
            <div class="slider-row"><label>B信标</label><input type="range" id="rssiB" min="-90" max="-30" value="-60"><span id="valB">-60</span> dBm</div>
            <div class="slider-row"><label>C信标</label><input type="range" id="rssiC" min="-90" max="-30" value="-65"><span id="valC">-65</span> dBm</div>
        </div>

        <div class="coordinate-view">
            <canvas id="locCanvas" width="360" height="360"></canvas>
            <div class="position-info" id="posInfo">
                <div>📶 RSSI / 距离：</div>
                <div id="rssiDistText">--</div>
                <div>📍 目标坐标：(<span id="targetX">--</span>, <span id="targetY">--</span>)</div>
            </div>
        </div>
        <div class="algo-steps" id="algoSteps">等待数据...</div>
    </div>
</div>
<div id="toastBox"></div>

<script>
    (function() {
        const UID = '28449f804baf4a4a87efedc38a9e60ac';
        const DATA_TOPIC = 'kgshuju';
        const CTRL_TOPIC = 'kgctrl';
        const SVC_UUID = '0000fff0-0000-1000-8000-00805f9b34fb';

        let pollingTimer, history=[], alarmOn=false;
        let bluetoothDevice=null, advTimer=null;
        let currentRSSI=-60;
        let useSimMode = true; // 默认模拟模式
        const TX_POWER = -59, N_FACTOR = 1.8, SCALE = 25; // 像素/米

        // 三个信标固定坐标（画布像素）
        const beacons = [
            { x:80, y:80,  name:'A' },
            { x:280, y:80, name:'B' },
            { x:180, y:280,name:'C' }
        ];

        // DOM
        const navTabs = document.querySelectorAll('.nav-tab');
        const views = document.querySelectorAll('.view');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const connStatus = document.getElementById('connStatus');
        const modeRealBtn = document.getElementById('modeRealBtn');
        const modeSimBtn = document.getElementById('modeSimBtn');
        const simSliders = document.getElementById('simSliders');
        const rssiA = document.getElementById('rssiA');
        const rssiB = document.getElementById('rssiB');
        const rssiC = document.getElementById('rssiC');
        const valA = document.getElementById('valA');
        const valB = document.getElementById('valB');
        const valC = document.getElementById('valC');
        const rssiDistText = document.getElementById('rssiDistText');
        const targetX = document.getElementById('targetX');
        const targetY = document.getElementById('targetY');
        const algoSteps = document.getElementById('algoSteps');
        const locCanvas = document.getElementById('locCanvas');
        const ctx = locCanvas.getContext('2d');

        // 导航
        navTabs.forEach(tab => {
            tab.addEventListener('click', ()=>{
                navTabs.forEach(t=>t.classList.remove('active'));
                tab.classList.add('active');
                views.forEach(v=>v.classList.remove('active'));
                document.getElementById('view-'+tab.dataset.view).classList.add('active');
            });
        });

        function showToast(msg) {
            const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
            document.getElementById('toastBox').appendChild(el);
            setTimeout(()=>el.remove(), 2500);
        }

        // ================= 巴法云 =================
        async function fetchData() {
            try {
                const url = `https://apis.bemfa.com/va/getmsg?uid=${UID}&topic=${DATA_TOPIC}&type=3&num=1`;
                const resp = await fetch(url, {cache:'no-store'});
                const json = await resp.json();
                if(json.code===0 && json.data?.length>0 && json.data[0].msg){
                    const raw = json.data[0].msg;
                    const parts = raw.replace(/^#/,'').split('#');
                    if(parts.length>=5){
                        const gas=parseFloat(parts[0]), co=parseFloat(parts[1]), hr=parseFloat(parts[2]);
                        const temp=parseFloat(parts[3]), humi=parseFloat(parts[4]);
                        if(!isNaN(gas)&&!isNaN(co)&&!isNaN(hr)&&!isNaN(temp)&&!isNaN(humi)){
                            document.getElementById('gasVal').textContent=gas.toFixed(2);
                            document.getElementById('coVal').textContent=co.toFixed(1);
                            document.getElementById('hrVal').textContent=hr.toFixed(0);
                            document.getElementById('tempVal').textContent=temp.toFixed(1);
                            document.getElementById('humiVal').textContent=humi.toFixed(1);
                            history.push({time:new Date().toLocaleTimeString('zh-CN',{hour12:false}),gas,co,hr,temp,humi});
                            if(history.length>50) history.shift();
                            updateCharts();
                        }
                    }
                }
            } catch(e){ console.error(e); }
        }

        let multiChart, hrChart;
        function initCharts() {
            multiChart = echarts.init(document.getElementById('chartMulti'));
            hrChart = echarts.init(document.getElementById('chartHR'));
            window.addEventListener('resize', ()=>{ multiChart?.resize(); hrChart?.resize(); });
        }
        function updateCharts() {
            if(!multiChart||!hrChart) return;
            const times = history.map(d=>d.time);
            multiChart.setOption({
                tooltip:{trigger:'axis'}, legend:{data:['瓦斯%','CO ppm','温度°C','湿度%'],bottom:0},
                grid:{left:50,right:20,top:20,bottom:35},
                xAxis:{data:times, axisLabel:{rotate:30,fontSize:10}},
                yAxis:{type:'value'},
                series:[
                    {name:'瓦斯%',type:'line',data:history.map(d=>d.gas),smooth:true,lineStyle:{color:'#f08a4b'}},
                    {name:'CO ppm',type:'line',data:history.map(d=>d.co),smooth:true,lineStyle:{color:'#e74c3c'}},
                    {name:'温度°C',type:'line',data:history.map(d=>d.temp),smooth:true,lineStyle:{color:'#f59e0b'}},
                    {name:'湿度%',type:'line',data:history.map(d=>d.humi),smooth:true,lineStyle:{color:'#4ea8de'}}
                ]
            });
            hrChart.setOption({
                tooltip:{}, grid:{left:50,right:20,top:20,bottom:30},
                xAxis:{data:times, axisLabel:{rotate:30}},
                yAxis:{name:'bpm'},
                series:[{type:'line',data:history.map(d=>d.hr),smooth:true,lineStyle:{color:'#2ecc71'},areaStyle:{color:'rgba(46,204,113,0.1)'}}]
            });
        }

        window.exportData = function() {
            if(!history.length) return showToast('无数据');
            let csv='\uFEFF时间,瓦斯%,CO ppm,心率bpm,温度°C,湿度%\n';
            history.forEach(d=>csv+=`${d.time},${d.gas},${d.co},${d.hr},${d.temp},${d.humi}\n`);
            const blob=new Blob([csv],{type:'text/csv'});
            const a=document.createElement('a');
            a.href=URL.createObjectURL(blob); a.download=`矿井监测_${new Date().toISOString().slice(0,10)}.csv`;
            a.click(); showToast('CSV已导出');
        };

        window.toggleAlarm = async function() {
            alarmOn=!alarmOn;
            document.getElementById('alarmStatusBadge').textContent=alarmOn?'开启':'关闭';
            document.getElementById('alarmStatusBadge').className=alarmOn?'badge badge-on':'badge badge-off';
            try {
                const params = new URLSearchParams();
                params.append('uid',UID); params.append('topic',CTRL_TOPIC);
                params.append('type','3'); params.append('msg','A');
                await fetch('https://apis.bemfa.com/va/postmsg',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:params});
                showToast(alarmOn?'🚨 报警已开启':'🔕 报警已关闭');
            } catch(e){ console.error(e); }
        };

        // ================= 定位计算 =================
        function rssiToDistance(rssi) {
            return Math.pow(10, (TX_POWER - rssi) / (10 * N_FACTOR));
        }

        function trilateration(x1,y1,r1, x2,y2,r2, x3,y3,r3) {
            const A = 2*x2 - 2*x1, B = 2*y2 - 2*y1;
            const C = r1*r1 - r2*r2 - x1*x1 + x2*x2 - y1*y1 + y2*y2;
            const D = 2*x3 - 2*x2, E = 2*y3 - 2*y2;
            const F = r2*r2 - r3*r3 - x2*x2 + x3*x3 - y2*y2 + y3*y3;
            const denom = A*E - B*D;
            if(Math.abs(denom) < 0.01) return null;
            const x = (C*E - F*B) / denom;
            const y = (A*F - C*D) / denom;
            return {x, y};
        }

        function updateRealPosition() {
            const rssi = currentRSSI;
            const d = rssiToDistance(rssi);
            // 简单映射：固定角度45°，距离放大
            const angle = Math.PI/4;
            const px = 180 + d * SCALE * Math.cos(angle);
            const py = 180 + d * SCALE * Math.sin(angle);
            rssiDistText.innerHTML = `RSSI: ${rssi} dBm → 距离: ${d.toFixed(2)} m`;
            targetX.textContent = ((px-180)/SCALE).toFixed(2);
            targetY.textContent = ((py-180)/SCALE).toFixed(2);
            drawReal(px, py, d);
            algoSteps.innerHTML = `
                <strong>📡 RSSI:</strong> ${rssi} dBm<br>
                <strong>📐 d = 10^((TxPower-RSSI)/(10*n)) = ${d.toFixed(2)} m</strong><br>
                <strong>📍 映射坐标 (45°):</strong> (${((px-180)/SCALE).toFixed(2)}, ${((py-180)/SCALE).toFixed(2)}) m
            `;
        }

        function updateSimPosition() {
            const rA = parseInt(rssiA.value), rB = parseInt(rssiB.value), rC = parseInt(rssiC.value);
            valA.textContent = rA; valB.textContent = rB; valC.textContent = rC;
            const dA = rssiToDistance(rA), dB = rssiToDistance(rB), dC = rssiToDistance(rC);
            // 信标像素坐标
            const pos = trilateration(beacons[0].x, beacons[0].y, dA*SCALE,
                                       beacons[1].x, beacons[1].y, dB*SCALE,
                                       beacons[2].x, beacons[2].y, dC*SCALE);
            if(pos) {
                targetX.textContent = pos.x.toFixed(1);
                targetY.textContent = pos.y.toFixed(1);
                drawSim(pos.x, pos.y, dA, dB, dC);
                rssiDistText.innerHTML = `dA=${dA.toFixed(2)}m, dB=${dB.toFixed(2)}m, dC=${dC.toFixed(2)}m`;
                algoSteps.innerHTML = `
                    <strong>信标A:</strong> RSSI ${rA} → 距离 ${dA.toFixed(2)} m<br>
                    <strong>信标B:</strong> RSSI ${rB} → 距离 ${dB.toFixed(2)} m<br>
                    <strong>信标C:</strong> RSSI ${rC} → 距离 ${dC.toFixed(2)} m<br>
                    <strong>🔺 三点定位解算:</strong><br>
                    &nbsp;&nbsp;联立圆方程: (x-xA)²+(y-yA)²=dA² ...<br>
                    &nbsp;&nbsp;解得目标坐标: (${pos.x.toFixed(1)}, ${pos.y.toFixed(1)})
                `;
            }
        }

        function drawReal(tx, ty, d) {
            ctx.clearRect(0,0,360,360);
            // 原点
            ctx.fillStyle='#f08a4b'; ctx.beginPath(); ctx.arc(180,180,6,0,2*Math.PI); ctx.fill();
            ctx.fillText('原点',190,175);
            // 目标
            ctx.fillStyle='#2ecc71'; ctx.beginPath(); ctx.arc(tx, ty, 7,0,2*Math.PI); ctx.fill();
            ctx.fillText('目标', tx+10, ty-10);
            ctx.strokeStyle='#f59e0b'; ctx.lineWidth=2;
            ctx.beginPath(); ctx.moveTo(180,180); ctx.lineTo(tx,ty); ctx.stroke();
            ctx.beginPath(); ctx.arc(180,180, d*SCALE, 0, 2*Math.PI); ctx.stroke();
        }

        function drawSim(tx, ty, dA, dB, dC) {
            ctx.clearRect(0,0,360,360);
            // 三个信标
            beacons.forEach((b,i) => {
                ctx.fillStyle='#4ea8de';
                ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, 2*Math.PI); ctx.fill();
                ctx.fillText(b.name, b.x+10, b.y-8);
            });
            // 距离圆
            const dists = [dA, dB, dC];
            beacons.forEach((b,i) => {
                ctx.strokeStyle = ['#f08a4b','#4ea8de','#f59e0b'][i];
                ctx.lineWidth=1;
                ctx.beginPath(); ctx.arc(b.x, b.y, dists[i]*SCALE, 0, 2*Math.PI); ctx.stroke();
            });
            // 目标点
            ctx.fillStyle='#2ecc71'; ctx.beginPath(); ctx.arc(tx, ty, 7, 0, 2*Math.PI); ctx.fill();
            ctx.fillText('目标', tx+10, ty-10);
        }

        // 模式切换
        function setMode(sim) {
            useSimMode = sim;
            modeRealBtn.style.background = sim ? '' : 'var(--accent)';
            modeSimBtn.style.background = sim ? 'var(--accent)' : '';
            simSliders.style.display = sim ? 'flex' : 'none';
            if(sim) updateSimPosition();
            else updateRealPosition();
        }

        // 蓝牙连接
        async function connectDevice() {
            if (!navigator.bluetooth) { alert('需要Web Bluetooth'); return; }
            try {
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters:[{services:[SVC_UUID]}], optionalServices:[SVC_UUID]
                });
                await bluetoothDevice.gatt.connect();
                connStatus.textContent = '已连接';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                showToast('已连接，尝试监听信号...');
                startRSSIUpdate();
            } catch(e) {
                if(!e.message.includes('cancelled')) showToast('连接失败: '+e.message);
            }
        }

        function startRSSIUpdate() {
            if(bluetoothDevice.watchAdvertisements) {
                bluetoothDevice.watchAdvertisements().then(() => {
                    bluetoothDevice.addEventListener('advertisementreceived', (event) => {
                        currentRSSI = event.rssi;
                        if(!useSimMode) updateRealPosition();
                    });
                }).catch(() => {
                    showToast('广告监听失败');
                });
            } else {
                showToast('当前环境不支持广告监听，请使用模拟模式');
            }
        }

        function disconnect() {
            if(bluetoothDevice && bluetoothDevice.gatt.connected) bluetoothDevice.gatt.disconnect();
            connStatus.textContent = '未连接';
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
        }

        // 事件
        modeRealBtn.addEventListener('click', ()=> setMode(false));
        modeSimBtn.addEventListener('click', ()=> setMode(true));
        rssiA.addEventListener('input', updateSimPosition);
        rssiB.addEventListener('input', updateSimPosition);
        rssiC.addEventListener('input', updateSimPosition);
        connectBtn.addEventListener('click', connectDevice);
        disconnectBtn.addEventListener('click', disconnect);

        // 初始化
        function init() {
            initCharts();
            startMonitoring();
            setMode(true); // 默认模拟模式
        }
        init();
    })();
</script>
</body>
</html>
